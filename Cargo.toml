[package]
name = "dawdle"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Records every build your repo runs, then tells you which step got slower, when it happened, and what caused it."
license = "MIT"
repository = "https://github.com/isiliconx/dawdle"
homepage = "https://github.com/isiliconx/dawdle"
readme = "README.md"
keywords = ["build", "performance", "profiler", "ci", "devtools", "regression"]
categories = ["development-tools::profiling", "command-line-utilities"]
exclude = ["/.github", "/tests/fixtures"]

[[bin]]
name = "dawdle"
path = "src/main.rs"

[dependencies]
# Pinned: rusqlite >= 0.32 pulls sqlite-wasm-rs -> hashlink, which requires the
# edition2024 cargo feature. Bundled SQLite means we ship a static binary with no
# system libsqlite3 dependency, which is the whole point of a one-file tool.
anyhow = "1"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for resetting SIGPIPE on Unix. Already in the tree via rusqlite, but a
# direct use should be a declared dependency rather than a transitive accident.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "=3.10.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
